derived_stats:
  body_scale: clamp(1.0 + SIZ1.effect(a1) + SIZ1.effect(a2), 0.84, 1.16)
  aquatic: clamp(20 + AQU1.effects + APP1.fins_bonus, 0, 100)
  cold: clamp(20 + CLD1.effects + SKN1.fuzzy_bonus + body_size_cold_modifier, 0, 100)
  heat: clamp(20 + HOT1.effects + SKN1.smooth_bonus + body_size_heat_modifier, 0,
    100)
  photosynthesis: clamp(PHO1.effects + APP1.leaves_bonus + SKN1.veined_bonus, 0, 100)
  metabolism: clamp(50 + MET1.effects, 0, 100)
  curiosity: clamp(50 + CUR1.effects, 0, 100)
  calmness: clamp(50 + CAL1.effects, 0, 100)
  heterozygosity: heterozygous_loci / 24
  energy_capacity: 100 + ENR1.effects + round((metabolism-50)*0.20) + size_modifier
    - health_penalty
  endurance: clamp(50 + END1.effects + 0.10*(energy_capacity-100) + heterozygosity_bonus
    - health_penalty, 0, 100)
  fertility: clamp(70 + (metabolism-50)*0.30 + heterozygosity_bonus - health_penalty
    - inbreeding_modifier, 10, 100)
  maturation_hours: clamp(8 - metabolism_modifier + size_modifier + health_modifier,
    5, 14)
